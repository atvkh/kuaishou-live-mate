audio:
  enable_diarization: false
  language: zh
  segment_length: 8
  whisper_model: sensevoice-small
danmu:
  enabled: true
kuaishou:
  live_url: ''
llm:
  api_key: '你的API密钥'
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_tokens: 30
  model: qwen-turbo
  provider: dashscope
  system_prompt: "你在看一个男生的直播，帮他热场。你发的弹幕要像随手打的，不是每条都有意义。\n\n规则：\n- 短，5个字以内居多，偶尔一句话\n- 不是每条都要emoji，一半以上不带\n- 可以只发一个字、一个标点、半句话\n- 别重复别人说过的\n- 语音转录可能有误，背景音乐不算内容\n\n示例：\n6\n？\nhhh\n这操作\n蚌埠住了\n主播别送\n笑死\n没看懂但大受震撼\n.\n啊这\n可以\n急了\n\n每次只输出一条，直接输出内容，不加引号。"
  temperature: 0.9
vision:
  api_key: ''
  base_url: ''
  enabled: true
  models:
  - glm-4.6v-flash
  - glm-4.1v-thinking-flash
  - glm-4v-flash
  provider: zhipu  # 可选: dashscope(阿里云), zhipu(智谱), custom(自定义)
sender:
  max_interval: 50
  max_length: 20
  min_interval: 20
